<text xml:space="preserve" text-anchor="start" x="13" y="-397.62" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="20.00">GoBench cockroach #1462</text>
<text xml:space="preserve" text-anchor="start" x="268" y="-397.62" font-family="Helvetica,sans-Serif" font-size="14.00"> &#160;</text>
<text xml:space="preserve" text-anchor="start" x="275.5" y="-397.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Mixed Deadlock / Channel &amp; WaitGroup</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-377.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-377.18" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-366.18" font-family="Helvetica,sans-Serif" font-size="11.00">`s.stop.Wait()` in `Stop()` not guaranteed to be invoked The test cases used here have omitted more</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-355.18" font-family="Helvetica,sans-Serif" font-size="11.00">details compared to the actual code in the real word project. This could potentially introduce new bugs.</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-344.18" font-family="Helvetica,sans-Serif" font-size="11.00">You can find further discussions regarding this matter</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-333.18" font-family="Helvetica,sans-Serif" font-size="11.00">[here](https://github.com/timmyyuan/gobench/issues/7).</text>
<text xml:space="preserve" text-anchor="start" x="90.44" y="-308.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00">IPs detected:</text>
<polygon fill="#6b7280" stroke="none" points="251.88,-302.62 251.88,-323.62 586,-323.62 586,-302.62 251.88,-302.62"/>
<text xml:space="preserve" text-anchor="start" x="329.31" y="-309.38" font-family="Helvetica,sans-Serif" font-size="14.00" fill="white"> no interface pattern detected </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-285.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">What the CFSM shows:</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-274.18" font-family="Helvetica,sans-Serif" font-size="11.00">• no unmatched send/receive: every channel has both ends. Any bug lies in ordering (needs the synthesis step), or in the</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-263.18" font-family="Helvetica,sans-Serif" font-size="11.00">lock / WaitGroup / Cond part, which the CFSM does not model</text>
<text xml:space="preserve" text-anchor="start" x="297.62" y="-242.38" font-family="Helvetica,sans-Serif" font-size="14.00"> </text>
