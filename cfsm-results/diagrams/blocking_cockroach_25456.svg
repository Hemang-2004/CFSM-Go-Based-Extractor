<text xml:space="preserve" text-anchor="start" x="13" y="-340.18" font-family="Helvetica,sans-Serif" font-size="11.00">This is some description from developers &gt; When CheckConsistency returns an error, the queue checks</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-329.18" font-family="Helvetica,sans-Serif" font-size="11.00">whether the store is draining to decide whether the error is worth logging. Unfortunately this check was</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-318.18" font-family="Helvetica,sans-Serif" font-size="11.00">incorrect and would block until the store actually started draining. This bug is because of channel</text>
