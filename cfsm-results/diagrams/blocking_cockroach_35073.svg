<text xml:space="preserve" text-anchor="start" x="13" y="-472.18" font-family="Helvetica,sans-Serif" font-size="11.00">This is some description from developers &gt; Previously, the outbox could fail during startup without</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-461.18" font-family="Helvetica,sans-Serif" font-size="11.00">closing its RowChannel. This could lead to deadlocked flows in rare cases. Channel communication mismatch</text>
