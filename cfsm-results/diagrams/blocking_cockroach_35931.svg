<text xml:space="preserve" text-anchor="start" x="286.75" y="-387.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Communication Deadlock / Channel</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-367.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-367.18" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-356.18" font-family="Helvetica,sans-Serif" font-size="11.00">This is some description from developers &gt; Previously, if a processor that reads from multiple inputs was</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-345.18" font-family="Helvetica,sans-Serif" font-size="11.00">waiting on one input to provide more data, and the other input was full, and both inputs were connected</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-334.18" font-family="Helvetica,sans-Serif" font-size="11.00">to inbound streams, it was possible to deadlock the system during flow cancellation when trying to</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-323.18" font-family="Helvetica,sans-Serif" font-size="11.00">propagate the cancel…</text>
<text xml:space="preserve" text-anchor="start" x="121.56" y="-298.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00">IPs detected:</text>
