<text xml:space="preserve" text-anchor="start" x="13" y="-540.62" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="20.00">GoBench kubernetes #10182</text>
<text xml:space="preserve" text-anchor="start" x="286" y="-540.62" font-family="Helvetica,sans-Serif" font-size="14.00"> &#160;</text>
<text xml:space="preserve" text-anchor="start" x="293.5" y="-540.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Mixed Deadlock / Channel &amp; Lock</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-520.17" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-520.17" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-509.17" font-family="Helvetica,sans-Serif" font-size="11.00">This is a lock&#45;channel bug. goroutine 1 is blocked on a lock held by goroutine 3, while goroutine 3 is</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-498.17" font-family="Helvetica,sans-Serif" font-size="11.00">blocked on sending message to ch, which is read by goroutine 1.</text>
<text xml:space="preserve" text-anchor="start" x="34.6" y="-473.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00">IPs detected:</text>
<polygon fill="#1b7f3b" stroke="none" points="140.2,-467.62 140.2,-488.62 307.15,-488.62 307.15,-467.62 140.2,-467.62"/>
<text xml:space="preserve" text-anchor="start" x="161.8" y="-473.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00" fill="white"> IP&#45;1 </text>
<text xml:space="preserve" text-anchor="start" x="194.05" y="-473.32" font-family="Helvetica,sans-Serif" font-size="14.00" fill="white"> Send/Receive </text>
<polygon fill="#0369a1" stroke="none" points="350.35,-467.62 350.35,-488.62 542.8,-488.62 542.8,-467.62 350.35,-467.62"/>
<text xml:space="preserve" text-anchor="start" x="371.95" y="-473.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00" fill="white"> IP&#45;7 </text>
<text xml:space="preserve" text-anchor="start" x="404.2" y="-473.32" font-family="Helvetica,sans-Serif" font-size="14.00" fill="white"> Multiple exchange </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-450.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">What the CFSM shows:</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-439.18" font-family="Helvetica,sans-Serif" font-size="11.00">• no unmatched send/receive: every channel has both ends. Any bug lies in ordering (needs the synthesis step), or in the</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-428.18" font-family="Helvetica,sans-Serif" font-size="11.00">lock / WaitGroup / Cond part, which the CFSM does not model</text>
<text xml:space="preserve" text-anchor="start" x="297.62" y="-407.38" font-family="Helvetica,sans-Serif" font-size="14.00"> </text>
