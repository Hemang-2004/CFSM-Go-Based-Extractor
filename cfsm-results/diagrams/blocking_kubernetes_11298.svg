<text xml:space="preserve" text-anchor="start" x="13" y="-555.62" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="20.00">GoBench kubernetes #11298</text>
<text xml:space="preserve" text-anchor="start" x="284.5" y="-555.62" font-family="Helvetica,sans-Serif" font-size="14.00"> &#160;</text>
<text xml:space="preserve" text-anchor="start" x="292" y="-555.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Communication Deadlock / Channel &amp; Condition Variable</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-535.17" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-535.17" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-524.17" font-family="Helvetica,sans-Serif" font-size="11.00">Some description from developers or pervious reseachers &gt; n.node used the n.lock as underlaying locker.</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-513.17" font-family="Helvetica,sans-Serif" font-size="11.00">The service loop initially locked it, the Notify function tried to lock it before calling n.node.Signal,</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-502.17" font-family="Helvetica,sans-Serif" font-size="11.00">leading to a dead&#45;lock. `n.cond.Signal()` at line 59 and line 81 are not guaranteed to `n.cond.Wait` at</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-491.17" font-family="Helvetica,sans-Serif" font-size="11.00">line 56.</text>
<text xml:space="preserve" text-anchor="start" x="117.25" y="-466.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00">IPs detected:</text>
<polygon fill="#6b7280" stroke="none" points="305.5,-460.62 305.5,-481.62 693.25,-481.62 693.25,-460.62 305.5,-460.62"/>
<text xml:space="preserve" text-anchor="start" x="409.75" y="-467.38" font-family="Helvetica,sans-Serif" font-size="14.00" fill="white"> no interface pattern detected </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-443.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">What the CFSM shows:</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-432.18" font-family="Helvetica,sans-Serif" font-size="11.00">• no unmatched send/receive: every channel has both ends. Any bug lies in ordering (needs the synthesis step), or in the</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-421.18" font-family="Helvetica,sans-Serif" font-size="11.00">lock / WaitGroup / Cond part, which the CFSM does not model</text>
<text xml:space="preserve" text-anchor="start" x="351.25" y="-400.38" font-family="Helvetica,sans-Serif" font-size="14.00"> </text>
