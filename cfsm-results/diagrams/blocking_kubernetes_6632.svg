<text xml:space="preserve" text-anchor="start" x="274.75" y="-533.62" font-family="Helvetica,sans-Serif" font-size="14.00"> &#160;</text>
<text xml:space="preserve" text-anchor="start" x="282.25" y="-533.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Mixed Deadlock / Channel &amp; Lock</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-513.17" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-513.17" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-502.17" font-family="Helvetica,sans-Serif" font-size="11.00">This is a lock&#45;channel bug. When resetChan is full, WriteFrame holds the lock and blocks on the channel.</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-491.17" font-family="Helvetica,sans-Serif" font-size="11.00">Then monitor() fails to close the resetChan because lock is already held by WriteFrame. Fix: create a</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-480.17" font-family="Helvetica,sans-Serif" font-size="11.00">goroutine to drain the channel</text>
<text xml:space="preserve" text-anchor="start" x="67.25" y="-455.32" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14.00">IPs detected:</text>
