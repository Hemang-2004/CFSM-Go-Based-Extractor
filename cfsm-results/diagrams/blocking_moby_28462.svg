<text xml:space="preserve" text-anchor="start" x="311.88" y="-354.32" font-family="Helvetica,sans-Serif" font-size="14.00" fill="white"> Send/Receive </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-331.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">What the CFSM shows:</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-320.18" font-family="Helvetica,sans-Serif" font-size="11.00">• no unmatched send/receive: every channel has both ends. Any bug lies in ordering (needs the synthesis step), or in the</text>
