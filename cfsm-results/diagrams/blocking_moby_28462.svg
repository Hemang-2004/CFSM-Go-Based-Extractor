<text xml:space="preserve" text-anchor="start" x="232.75" y="-432.62" font-family="Helvetica,sans-Serif" font-size="14.00"> &#160;</text>
<text xml:space="preserve" text-anchor="start" x="240.25" y="-432.62" font-family="Helvetica,sans-Serif" font-size="13.00" fill="#475569">Blocking / Mixed Deadlock / Channel &amp; Lock</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-412.18" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Issue:</text>
<text xml:space="preserve" text-anchor="start" x="44.5" y="-412.18" font-family="Helvetica,sans-Serif" font-size="11.00"> </text>
<text xml:space="preserve" text-anchor="start" x="13" y="-401.18" font-family="Helvetica,sans-Serif" font-size="11.00">There are three goroutines mentioned in the bug report Moby#28405. Actually, only two goroutines are</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-390.18" font-family="Helvetica,sans-Serif" font-size="11.00">needed to trigger this bug. This bug is another example where lock and channel are mixed with each other.</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-379.18" font-family="Helvetica,sans-Serif" font-size="11.00">Moby#28405 : https://github.com/moby/moby/issues/28405</text>
